# Bonus: Terraform plan via GitHub OIDC / WIF (plan-only).
# Requires enable_wif=true applied and repository variables configured.
# Skips forks. Never applies. No SA JSON keys.
name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/poc
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate to Google Cloud
        # google-github-actions/auth v2.1.5
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_PLAN_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced210762dc
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Terraform init (remote state)
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          prefix = "poc"
          EOF
          terraform init -backend-config=backend.hcl

      - name: Generate ephemeral synthetic inputs (masked)
        id: secrets
        run: |
          DB=$(openssl rand -base64 24)
          TOK=$(openssl rand -base64 24)
          echo "::add-mask::$DB"
          echo "::add-mask::$TOK"
          echo "TF_VAR_db_password=$DB" >> "$GITHUB_ENV"
          echo "TF_VAR_third_party_api_token=$TOK" >> "$GITHUB_ENV"

      - name: Terraform plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_enable_workloads: "false"
          TF_VAR_enable_wif: "true"
        run: |
          terraform plan -input=false -no-color -lock=false | tee /tmp/tfplan.txt
          # Redact common secret markers if any leak into logs
          grep -vE '(password|secret_data|token)' /tmp/tfplan.txt > /tmp/tfplan.redacted.txt || true

      - name: Comment plan summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let body = 'Terraform plan completed (plan-only; no apply). See workflow logs for details.';
            try {
              const txt = fs.readFileSync('/tmp/tfplan.redacted.txt', 'utf8');
              const clip = txt.slice(-6000);
              body = '### Terraform plan (redacted)\n```\n' + clip + '\n```';
            } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
